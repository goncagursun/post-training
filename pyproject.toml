[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-training"
version = "0.1.0"
description = "Learning MVP for a post-training platform"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "transformers>=4.56,<5",
    "peft>=0.17,<1",
    "trl>=0.23,<0.24",
    "datasets>=3,<5",
    "accelerate>=1,<2",
    "ray>=2.40,<3",
]

[project.optional-dependencies]
platform = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
