[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-training"
version = "0.1.0"
description = "Learning MVP for a post-training platform"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "transformers>=4.56,<5",
    "peft>=0.17,<1",
    "trl>=0.23,<0.24",
    "datasets>=3,<5",
    "accelerate>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
