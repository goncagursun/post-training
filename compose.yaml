services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: post_training
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: post_training
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post_training -d post_training"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  platform_postgres:
